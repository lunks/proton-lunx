name: _job_build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string

jobs:
  proton:
    name: Build ${{ inputs.name }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Cleanup disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: |
            azure-cli google-cloud-cli google-chrome-stable firefox microsoft-edge-stable
            postgresql* mysql* php* temurin-* *llvm* clang* mono-devel powershell dotnet-sdk-*
          remove_folders: |
            /usr/share/swift /usr/share/miniconda /usr/local/lib/node_modules
            /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia*
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/share/az*
            /usr/local/.ghcup

      - name: Prepare host
        run: sudo apt update && sudo apt-get install -y ccache fontforge-nox

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-proton-${{ github.run_id }}
          restore-keys: |
            ccache-proton

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: "Patch (lunx tree prep: submodules + gates + patches)"
        run: |
          # The fork's repo root IS the GE-Proton11-4 tree at the pin (see
          # source.env); the root commit is the import. lunx-patches.sh does the
          # shallow submodule fetch (bzip2 URL overridden away from sourceware,
          # bounded backoff), then runs GE's protonprep patch stack (patches/
          # protonprep-valve-staging.sh, same as upstream GE) with a hard gate on
          # the ds5-haptic marker, the wiring gates, the FEX describe --always
          # sed, and the xrandr pre-seed. Idempotent.
          bash tools/lunx-patches.sh
          mkdir ./build

      - name: Configure
        working-directory: ./build
        run: |
          DOCKER_DEFAULT_PLATFORM="linux/arm64" ../configure.sh --build-name=${{ inputs.name }} --target-arch=arm64 --container-engine=docker

      - name: Make ${{ inputs.name }}
        working-directory: ./build
        run: |
          # -s + SUPPRESS_WARNINGS=1 quiet the log; J=4 avoids the jobserver
          # leak into the container's re-entrant make; MAKE=make fixes the
          # host-make-path in the container.
          make -s J=4 TARGET_ARCH=arm64 MAKE=make SUPPRESS_WARNINGS=1 redist

      - name: Repackage as compatibilitytools.d tarball
        run: |
          mkdir -p out
          tar --zstd -cf out/proton-lunx-${{ inputs.name }}.tar.zst -C build ${{ inputs.name }}
          sha512sum out/proton-lunx-${{ inputs.name }}.tar.zst > out/proton-lunx-${{ inputs.name }}.tar.zst.sha512sum

      - name: Save ccache
        id: ccache-save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload artifact proton-lunx-${{ inputs.name }}.tar.zst
        uses: actions/upload-artifact@v5
        with:
          name: proton-lunx-${{ inputs.name }}.tar.zst
          path: ./out/proton-lunx-${{ inputs.name }}.tar.zst

      - name: Upload artifact proton-lunx-${{ inputs.name }}.tar.zst.sha512sum
        uses: actions/upload-artifact@v5
        with:
          name: proton-lunx-${{ inputs.name }}.tar.zst.sha512sum
          path: ./out/proton-lunx-${{ inputs.name }}.tar.zst.sha512sum
